# Gradle Proxy Settings
systemProp.http.proxyHost=192.168.100.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=192.168.100.1
systemProp.https.proxyPort=7890
# 确保阿里云和本地不走代理
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|mirrors.*
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|mirrors.*

# JVM Settings with TLS fix and Local Tmp Dir
org.gradle.jvmargs=-Xmx2048m -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Djava.io.tmpdir=/root/.nanobot/workspace/tmp
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
